<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO DE NOVO USUÁRIO - ARCHIVUM</title>
    <!-- Caminhos atualizados para estrutura HTML estática -->
    <link rel="icon" type="image/png" href="img/Logo01.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="d-flex flex-column min-vh-100">

<!-- HEADER PADRÃO UNIFICADO -->
<header class="shadow-sm mb-1" style="background-color: rgba(34, 40, 49, 1.0); border: 1px solid #222831; padding-top: 4px; padding-bottom: 4px;">
    <div class="container d-flex justify-content-between align-items-center">

        <!-- Logo e Título com espaçamento fixo -->
        <div class="d-flex align-items-center gap-2">
            <a href="index.html" class="text-decoration-none">
                <img src="img/Logo01_sem_fundo.png" alt="Logo ARCHIVUM" style="width:130px; height:130px; object-fit:contain; background:transparent;">
            </a>
            <h1 class="h3 mb-0 text-white" style="font-size: 2.5rem; font-weight: bold; letter-spacing: 2px;">ARCHIVUM</h1>
        </div>
        
        <!-- Navegação padrão -->
        <nav class="d-flex align-items-center" style="font-size: 1.25rem; gap: 1.5rem;">
            <a href="index.html" class="text-decoration-none text-primary"><b>HOME</b></a>
            <a href="politica_termos.html" class="text-decoration-none text-secondary"><b>TERMOS DE USO</b></a>
            <a href="cadastro.html" class="btn btn-success" style="font-size: 1rem;"><b>CADASTRO</b></a>
            <a href="login.html" class="btn btn-primary" style="font-size: 1rem;"><b>LOGIN</b></a>
        </nav>
    </div>
</header>

<!-- FORMULÁRIO DE CADASTRO -->
<div class="container-padrao bg-white p-8 rounded-2xl shadow-xl mt-5 mb-5 max-w-xl">
    <h2 class="text-3xl font-bold mb-6 text-center text-slate-800">CADASTRE-SE</h2>
    
    <!-- Div reservada para mensagens do Supabase -->
    <div id="alerta-mensagem" class="alert d-none text-center" role="alert"></div>
    
    <form id="form-cadastro" autocomplete="off" class="space-y-4">
        
        <div class="mb-3">
            <label for="registro_academico" class="form-label font-medium text-slate-700">Registro Acadêmico (RA): <button type="button" class="help-button" title="Informe o número do seu Registro Acadêmico (RA)." aria-label="Ajuda sobre Registro Acadêmico">?</button></label>
            <input type="text" id="registro_academico" name="registro_academico" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label for="nome" class="form-label font-medium text-slate-700">Nome Completo: <button type="button" class="help-button" title="Informe seu nome completo, sem abreviações e sem caracteres especiais." aria-label="Ajuda sobre Nome Completo">?</button></label>
            <input type="text" id="nome" name="nome" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label for="email" class="form-label font-medium text-slate-700">E-mail: <button type="button" class="help-button" title="Informe um endereço de e-mail válido ao qual você tenha acesso." aria-label="Ajuda sobre E-mail">?</button></label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label for="curso" class="form-label font-medium text-slate-700">Curso: <button type="button" class="help-button" title="Selecione o seu curso na UNIVESP." aria-label="Ajuda sobre Curso">?</button></label>
            <select id="curso" name="curso" class="form-control" required>
                <option value="">Carregando cursos...</option>
            </select>
        </div>
        
        <div class="mb-3">
            <label for="senha" class="form-label font-medium text-slate-700">Senha: <button type="button" class="help-button" title="Use de 8 a 20 caracteres, com pelo menos um caractere especial, um número e uma letra maiúscula." aria-label="Regras para a senha">?</button></label>
            <input type="password" id="senha" name="senha" class="form-control" required>
        </div>
        
        <div class="mb-4">
            <label for="confirmar_senha" class="form-label font-medium text-slate-700">Confirmar Senha: <button type="button" class="help-button" title="Digite novamente a mesma senha informada no campo anterior." aria-label="Ajuda sobre Confirmar Senha">?</button></label>
            <input type="password" id="confirmar_senha" name="confirmar_senha" class="form-control" required>
        </div>

        <button type="submit" id="btn-cadastrar" class="btn btn-primary w-100 py-2 font-bold">Cadastrar</button>
    </form>
    
    <div class="mt-4 text-center">
        <a href="login.html" class="fw-bold text-primary text-decoration-none">Já tem uma conta? Faça o login</a>
    </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white mt-auto py-4">
    <div class="text-center p-3 text-white">
        <b>A R C H I V U M</b> © 2026 Copyright
    </div>
</footer>

<!-- SCRIPTS JS -->
<script src="enviroments_config.js"></script>
<script src="javascript/supabaseService.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const selectCurso = document.getElementById("curso");
        const alertaMensagem = document.getElementById("alerta-mensagem");
        const formCadastro = document.getElementById("form-cadastro");

        try {
            const cursos = await SupabaseService.listarCursos();
            selectCurso.innerHTML = '<option value="">Selecione o seu curso</option>';
            
            if (cursos && cursos.length > 0) {
                cursos.forEach(c => {
                    const option = document.createElement("option");
                    option.value = c.nome_curso;
                    option.textContent = c.nome_curso;
                    selectCurso.appendChild(option);
                });
            } else {
                selectCurso.innerHTML = '<option value="">Nenhum curso encontrado</option>';
            }
        } catch (error) {
            console.error("Erro ao carregar cursos:", error);
            selectCurso.innerHTML = '<option value="">Erro ao carregar cursos</option>';
        }

        formCadastro.addEventListener("submit", async (e) => {
            e.preventDefault();

            const ra = document.getElementById("registro_academico").value.trim();
            const nome = document.getElementById("nome").value.trim();
            const email = document.getElementById("email").value.trim();
            const curso = selectCurso.value;
            const senha = document.getElementById("senha").value;
            const confirmarSenha = document.getElementById("confirmar_senha").value;

            alertaMensagem.className = "alert d-none text-center";
            alertaMensagem.textContent = "";

            if (senha !== confirmarSenha) {
                alertaMensagem.className = "alert alert-danger text-center";
                alertaMensagem.textContent = "As senhas não coincidem!";
                alertaMensagem.classList.remove("d-none");
                return;
            }

            try {
                const res = await fetch(`${VARIABLES_CONFIG.url}${VARIABLES_CONFIG.tabela_usuario}?or=(registro_academico.eq.${ra},email.eq.${encodeURIComponent(email)})&select=registro_academico,email`, {
                    method: 'GET',
                    headers: {
                        'apikey': VARIABLES_CONFIG.anonKey,
                        'Authorization': `Bearer ${VARIABLES_CONFIG.anonKey}`,
                        'Content-Type': 'application/json'
                    }
                });
                const existentes = await res.json();
                
                if (existentes && existentes.length > 0) {
                    await SupabaseService.registrarLog(ra, 'CADASTRO_FALHA', null, '400', 'Tentativa de cadastro com RA ou E-mail já existente.');
                    alertaMensagem.className = "alert alert-danger text-center";
                    alertaMensagem.textContent = "Erro: Este Registro Acadêmico (RA) ou E-mail já está cadastrado no sistema.";
                    alertaMensagem.classList.remove("d-none");
                    return;
                }

                alertaMensagem.className = "alert alert-info text-center";
                alertaMensagem.textContent = "Cadastrando usuário...";
                alertaMensagem.classList.remove("d-none");

                const dadosUsuario = {
                    registro_academico: ra,
                    nome_completo: nome,
                    email: email,
                    nome_curso: curso,
                    password: senha
                };

                const resultado = await SupabaseService.cadastrarUsuario(dadosUsuario);

                if (resultado && resultado.error) {
                    await SupabaseService.registrarLog(ra, 'CADASTRO_FALHA', null, '400', 'Erro de duplicidade ou restrição no banco.');
                    alertaMensagem.className = "alert alert-danger text-center";
                    alertaMensagem.textContent = "Erro ao cadastrar: Dados já cadastrados no sistema.";
                    alertaMensagem.classList.remove("d-none");
                } else {
                    await SupabaseService.registrarLog(ra, 'CADASTRO_SUCESSO', null, '201', 'Usuário realizou cadastro com sucesso.');
                    alertaMensagem.className = "alert alert-success text-center";
                    alertaMensagem.textContent = "Cadastro realizado com sucesso! Redirecionando...";
                    alertaMensagem.classList.remove("d-none");
                    formCadastro.reset();
                    
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2000);
                }
            } catch (error) {
                console.error("Erro no processo de cadastro:", error);
                alertaMensagem.className = "alert alert-danger text-center";
                alertaMensagem.textContent = "Erro de conexão com o servidor.";
                alertaMensagem.classList.remove("d-none");
            }
        });
    });
</script>
</body>
</html>
