    const pdfEmbed = document.getElementById('pdfEmbed');
    const videoLink = document.getElementById('videoLink');
    
    function updateLinks() {
        const disciplina = disciplinaSelect.value;
        const aula = aulaSelect.value;
        
        // Trava de segurança: se estiver no "default", volta para o PDF vazio/padrão e encerra a função
        if (disciplina === 'default') {
            pdfLink.href = "assets/pdf/default/default.pdf";
            pdfEmbed.src = "assets/pdf/default/default.pdf";
            return;
        }

        const pdfUrl = pdfMap[disciplina][aula];
        const videoUrl = (videoMap[disciplina] && videoMap[disciplina][aula]) ? videoMap[disciplina][aula] : "https://www.youtube.com/watch?v=KxppXrcfMBA";
        
        if (pdfUrl) {
            pdfLink.href = pdfUrl;
            pdfEmbed.src = pdfUrl;
        }
        if (videoLink) {
            videoLink.href = videoUrl;
        }
    }
    
    if (disciplinaSelect && aulaSelect && pdfLink && pdfEmbed && videoLink) {
        disciplinaSelect.addEventListener('change', updateLinks);
        aulaSelect.addEventListener('change', updateLinks);
    }
